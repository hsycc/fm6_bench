name: fm6-v3-runtime

on:
  push:
    branches: [main, agent/fm6-bench-v3-target-cycles, agent/fm6-bench-v4-hw-runner]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fm6-v3-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  FELUCCA_SHA: 5738617968a22b5d4c0d3470cfcc95559052f446

jobs:
  host-harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Felucca
        uses: actions/checkout@v4
        with:
          repository: hugelton/Felucca
          ref: ${{ env.FELUCCA_SHA }}
          path: upstream/Felucca
          submodules: recursive
      - name: Generate FM6 tables
        run: |
          mkdir -p generated build/v3-host
          python3 upstream/Felucca/tools/gen_tables.py generated/felucca_tables.h
      - name: Build and run V3 host harness
        run: |
          set -euxo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Wno-unused-function \
            -Igenerated -Iupstream/Felucca/firmware/src -Ibench \
            bench/target_runtime_host.c -o build/v3-host/fm6_v3_host
          build/v3-host/fm6_v3_host | tee build/v3-host/results.txt
          grep -q '^FM6-V3 DONE$' build/v3-host/results.txt
          test "$(grep -c '^FM6-V3 voices=' build/v3-host/results.txt)" -eq 6
          for v in 1 8 12 16 20 24; do
            grep -q "^FM6-V3 voices=${v} " build/v3-host/results.txt
          done
          python3 scripts/parse_v3_runtime.py --label host-functional build/v3-host/results.txt \
            | tee build/v3-host/summary.txt
          grep -q '^FM6-V3-SAFE-MAX voices=24 ' build/v3-host/summary.txt
      - name: Smoke test physical hardware runner
        run: |
          set -euxo pipefail
          python3 scripts/run_v3_hardware.py --help > build/v3-host/hw-runner-help.txt
          python3 scripts/run_v3_hardware.py s3 --dry-run --port TEST --image flash_image.bin \
            | tee build/v3-host/hw-runner-s3-dry.txt
          python3 scripts/run_v3_hardware.py fm1 --dry-run --port TEST \
            | tee build/v3-host/hw-runner-fm1-dry.txt
          grep -q 'write-flash 0x0 flash_image.bin' build/v3-host/hw-runner-s3-dry.txt
          grep -q 'parse as real-s3' build/v3-host/hw-runner-s3-dry.txt
          grep -q "trigger=b'fm6bench" build/v3-host/hw-runner-fm1-dry.txt
          grep -q 'parse as real-ac7911b8' build/v3-host/hw-runner-fm1-dry.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v3-host-results
          path: build/v3-host/

  ac7911b8-runtime-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Felucca
        uses: actions/checkout@v4
        with:
          repository: hugelton/Felucca
          ref: ${{ env.FELUCCA_SHA }}
          path: upstream/Felucca
          submodules: recursive
      - name: Generate FM6 tables
        run: |
          mkdir -p generated build/v3-ac
          python3 upstream/Felucca/tools/gen_tables.py generated/felucca_tables.h
      - name: Install JieLi pi32v2 toolchain
        run: bash upstream/Felucca/tools/get_toolchain.sh "$HOME/.jieli"
      - name: Cross-compile V3 AC runtime and Felucca overlay
        run: |
          set -euxo pipefail
          TC="$HOME/.jieli/toolchain"
          COMMON='-target pi32v2 -std=c11 -O2 -ffunction-sections -fdata-sections -fno-builtin -Wno-unused-function -Igenerated -Iupstream/Felucca/firmware/src -Ibench'
          "$TC/pi32v2/bin/clang" $COMMON -c bench/target_runtime_ac7911b8.c -o build/v3-ac/runtime.o
          "$TC/common/bin/objdump" -d build/v3-ac/runtime.o > build/v3-ac/runtime.dis
          "$TC/common/bin/objdump" -t build/v3-ac/runtime.o > build/v3-ac/runtime.symbols
          grep -q 'fm6_bench_ac7911b8_run' build/v3-ac/runtime.symbols
          grep -q 'bench_rt_results' build/v3-ac/runtime.symbols

          python3 scripts/apply_felucca_v3_overlay.py upstream/Felucca
          python3 scripts/apply_felucca_v3_overlay.py upstream/Felucca
          test "$(grep -c 'fm6_bench_ac_core.inc' upstream/Felucca/firmware/src/felucca.c)" -eq 1
          test "$(grep -c 'con_word(&p, "fm6bench")' upstream/Felucca/firmware/src/console.c)" -eq 1

          OVERLAY_COMMON="$COMMON -Iupstream/Felucca/firmware/src/fm6_bench"
          "$TC/pi32v2/bin/clang" $OVERLAY_COMMON -c bench/felucca_overlay/overlay_core_smoke.c \
            -o build/v3-ac/overlay_core_smoke.o
          "$TC/pi32v2/bin/clang" $OVERLAY_COMMON -c bench/felucca_overlay/overlay_console_smoke.c \
            -o build/v3-ac/overlay_console_smoke.o
          cp upstream/Felucca/firmware/src/felucca.c build/v3-ac/felucca.patched.c
          cp upstream/Felucca/firmware/src/console.c build/v3-ac/console.patched.c
      - uses: actions/upload-artifact@v4
        with:
          name: v3-ac7911b8-runtime-build
          path: build/v3-ac/

  esp32s3-qemu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Felucca
        uses: actions/checkout@v4
        with:
          repository: hugelton/Felucca
          ref: ${{ env.FELUCCA_SHA }}
          path: upstream/Felucca
          submodules: recursive
      - name: Generate FM6 tables
        run: |
          mkdir -p generated build/v3-s3
          python3 upstream/Felucca/tools/gen_tables.py generated/felucca_tables.h
      - name: Build ESP32-S3 app and run in QEMU
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/work" -w /work espressif/idf:release-v5.5 bash -lc '
            set -euxo pipefail
            . "$IDF_PATH/export.sh"
            cd targets/esp32s3
            idf.py set-target esp32s3
            idf.py build
            cd build
            esptool.py --chip esp32s3 merge_bin --fill-flash-size 4MB -o flash_image.bin @flash_args
            cp flash_image.bin /work/build/v3-s3/
            cp flash_args /work/build/v3-s3/
            cp fm6_v3_target_bench.bin /work/build/v3-s3/
            cp fm6_v3_target_bench.elf /work/build/v3-s3/
            cp fm6_v3_target_bench.map /work/build/v3-s3/
            cp bootloader/bootloader.bin /work/build/v3-s3/
            cp partition_table/partition-table.bin /work/build/v3-s3/
            cp ../sdkconfig /work/build/v3-s3/
            set +e
            timeout 12s qemu-system-xtensa -nographic -machine esp32s3 \
              -drive file=flash_image.bin,if=mtd,format=raw \
              > /work/build/v3-s3/qemu.txt 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
              cat /work/build/v3-s3/qemu.txt
              exit "$rc"
            fi
            grep -q "^FM6-V3 DONE" /work/build/v3-s3/qemu.txt
            test "$(grep -c "^FM6-V3 voices=" /work/build/v3-s3/qemu.txt)" -eq 6
          '
          python3 scripts/parse_v3_runtime.py --label qemu-functional build/v3-s3/qemu.txt \
            | tee build/v3-s3/summary.txt
          cat build/v3-s3/qemu.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v3-esp32s3-qemu-results
          path: build/v3-s3/
